# 后端开发编排:FastAPI + PostgreSQL(pgvector)
# 用法:cd backend && docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: xiaoliyikao-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xiaoliyikao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: xiaoliyikao-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/xiaoliyikao
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app  # 热重载:本地代码映射进容器
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
